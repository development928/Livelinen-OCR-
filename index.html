<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Livelinen Card Scanner</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --text: #15202b;
      --hint: #667685;
      --card: #ffffff;
      --line: #d9e1e8;
      --accent: #0f6e56;
      --accent-text: #ffffff;
      --danger: #b42318;
      --ok: #067647;
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, #dff3ec 0%, transparent 40%),
        linear-gradient(180deg, #eef3f6 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .brand {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hint);
      margin: 0 0 8px;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; line-height: 1.2; }
    .sub { margin: 0 0 24px; color: var(--hint); line-height: 1.45; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 1rem; }
    .drop {
      border: 1.5px dashed #9db5c4;
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      background: #f8fbfd;
      cursor: pointer;
    }
    .drop strong { display: block; margin-bottom: 6px; }
    .drop span { color: var(--hint); font-size: 0.9rem; }
    .preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      display: none;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--hint);
    }
    label:first-child { margin-top: 0; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 110, 86, 0.15);
    }
    textarea { min-height: 84px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .phone-block {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      background: #f8fbfd;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      font: inherit;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      background: #e8eef3;
      color: var(--text);
      flex: 1;
    }
    .btn-danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid #f3c0bb;
    }
    .status {
      min-height: 1.3em;
      margin-top: 10px;
      font-size: 0.92rem;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      background: #e8eef3;
      color: var(--text);
      font-weight: 600;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-text);
    }
    .hidden { display: none !important; }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">Livelinen</p>
    <h1>Business Card Scanner</h1>
    <p class="sub">Upload a card for OCR, or enter details manually. Review and save when ready.</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tabUpload">Upload &amp; OCR</button>
      <button type="button" class="tab" id="tabManual">Manual entry</button>
    </div>

    <section class="panel" id="uploadPanel">
      <h2>1. Upload card image</h2>
      <div class="drop" id="dropZone">
        <strong>Click to choose image</strong>
        <span>JPG, PNG then run OCR</span>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </div>
      <img id="preview" class="preview" alt="Card preview" />
      <div class="actions">
        <button type="button" class="btn-primary" id="ocrBtn" disabled>Run OCR</button>
      </div>
      <p class="status" id="ocrStatus" role="status"></p>
    </section>

    <section class="panel" id="formPanel">
      <h2 id="formTitle">2. Review / edit details</h2>
      <form id="cardForm" novalidate>
        <div class="row">
          <div>
            <label for="first_name">First name</label>
            <input id="first_name" name="first_name" autocomplete="given-name" />
          </div>
          <div>
            <label for="last_name">Last name</label>
            <input id="last_name" name="last_name" autocomplete="family-name" />
          </div>
        </div>

        <label for="company_name">Company</label>
        <input id="company_name" name="company_name" autocomplete="organization" />

        <label for="emails">Emails (one per line)</label>
        <textarea id="emails" placeholder="name@company.com"></textarea>

        <label>Phone numbers</label>
        <div id="phones"></div>
        <div class="actions">
          <button type="button" class="btn-secondary" id="addPhoneBtn">+ Add phone</button>
        </div>

        <button type="submit" class="btn-primary" id="saveBtn">Save card</button>
        <p class="status" id="saveStatus" role="status"></p>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      var SUPABASE_URL = "https://xukgkqxkujygsupdjvvd.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1a2drcXhrdWp5Z3N1cGRqdnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTYwNTAsImV4cCI6MjA5NjIzMjA1MH0.N5hqWj9EvdrfEpwu6gVNuBwglRKlp-Z_lzJzKvdHyY4";
      var N8N_OCR_WEBHOOK_URL = "https://n8n.livelinen.org/webhook/c0ddefcc-4deb-49e6-a8c0-72c49da00a64";

      var db = null;
      var selectedFile = null;

      function $(id) {
        return document.getElementById(id);
      }

      function setStatus(node, message, type) {
        if (!node) return;
        node.textContent = message || "";
        node.className = "status" + (type ? " " + type : "");
      }

      function escapeAttr(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;");
      }

      function addPhoneRow(phone) {
        phone = phone || { type: "mobile", number: "" };
        var wrap = document.createElement("div");
        wrap.className = "phone-block";
        wrap.innerHTML =
          "<label>Type</label>" +
          '<input class="phone-type" value="' + escapeAttr(phone.type || "mobile") + '" placeholder="mobile / office / fax" />' +
          "<label>Number</label>" +
          '<input class="phone-number" value="' + escapeAttr(phone.number || "") + '" placeholder="+91..." inputmode="tel" />' +
          '<div class="actions"><button type="button" class="btn-danger remove-phone">Remove</button></div>';

        wrap.querySelector(".remove-phone").onclick = function () {
          wrap.remove();
          if ($("phones").children.length === 0) addPhoneRow();
        };
        $("phones").appendChild(wrap);
      }

      function fillForm(data) {
        $("first_name").value = data.first_name || "";
        $("last_name").value = data.last_name || "";
        $("company_name").value = data.company_name || "";
        $("emails").value = Object.prototype.toString.call(data.emails) === "[object Array]"
          ? data.emails.join("\n")
          : "";
        $("phones").innerHTML = "";
        var phones = data.phone_numbers || [];
        if (phones.length) {
          for (var i = 0; i < phones.length; i++) addPhoneRow(phones[i]);
        } else {
          addPhoneRow();
        }
      }

      function readEmails() {
        return $("emails").value
          .split(/\r?\n|,|;/)
          .map(function (s) { return s.trim(); })
          .filter(Boolean);
      }

      function readPhones() {
        var blocks = $("phones").querySelectorAll(".phone-block");
        var out = [];
        for (var i = 0; i < blocks.length; i++) {
          var number = blocks[i].querySelector(".phone-number").value.trim();
          if (!number) continue;
          out.push({
            type: blocks[i].querySelector(".phone-type").value.trim() || "other",
            number: number,
          });
        }
        return out;
      }

      function showUploadMode() {
        $("tabUpload").classList.add("active");
        $("tabManual").classList.remove("active");
        $("uploadPanel").classList.remove("hidden");
        $("formTitle").textContent = "2. Review / edit details";
        setStatus($("saveStatus"), "");
      }

      function showManualMode() {
        $("tabManual").classList.add("active");
        $("tabUpload").classList.remove("active");
        $("uploadPanel").classList.add("hidden");
        $("formTitle").textContent = "Enter details manually";
        setStatus($("ocrStatus"), "");
        setStatus($("saveStatus"), "Type the card details, then Save.");
        if ($("phones").children.length === 0) addPhoneRow();
        $("formPanel").scrollIntoView({ behavior: "smooth", block: "start" });
        setTimeout(function () { $("first_name").focus(); }, 50);
      }

      function fileToBase64(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var result = String(reader.result || "");
            resolve(result.indexOf(",") >= 0 ? result.split(",")[1] : result);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function initDb() {
        try {
          if (window.supabase && typeof window.supabase.createClient === "function") {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          }
        } catch (err) {
          console.error(err);
        }
      }

      function bindUi() {
        $("tabUpload").onclick = showUploadMode;
        $("tabManual").onclick = showManualMode;

        $("dropZone").onclick = function () {
          $("fileInput").click();
        };

        $("fileInput").onchange = function () {
          var file = $("fileInput").files && $("fileInput").files[0];
          if (!file) return;
          selectedFile = file;
          $("preview").src = URL.createObjectURL(file);
          $("preview").style.display = "block";
          $("ocrBtn").disabled = false;
          setStatus($("ocrStatus"), "Image ready. Click Run OCR.");
        };

        $("addPhoneBtn").onclick = function () {
          addPhoneRow();
        };

        $("ocrBtn").onclick = async function () {
          if (!selectedFile) return;
          $("ocrBtn").disabled = true;
          setStatus($("ocrStatus"), "Running OCR...");

          try {
            var imageBase64 = await fileToBase64(selectedFile);
            var res = await fetch(N8N_OCR_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                filename: selectedFile.name,
                mimeType: selectedFile.type || "image/jpeg",
                imageBase64: imageBase64,
              }),
            });
            if (!res.ok) throw new Error("OCR webhook failed (" + res.status + ")");
            var data = await res.json();
            fillForm(data);
            setStatus($("ocrStatus"), "OCR done. Review the form below.", "ok");
          } catch (err) {
            console.error(err);
            setStatus(
              $("ocrStatus"),
              "OCR failed: " + (err.message || "unknown error") + ". You can still type manually.",
              "error"
            );
            showManualMode();
          } finally {
            $("ocrBtn").disabled = !selectedFile;
          }
        };

        $("cardForm").onsubmit = async function (event) {
          event.preventDefault();
          setStatus($("saveStatus"), "");
          $("saveBtn").disabled = true;

          if (!db) {
            $("saveBtn").disabled = false;
            setStatus($("saveStatus"), "Save unavailable. Refresh the page.", "error");
            return;
          }

          var payload = {
            first_name: $("first_name").value.trim(),
            last_name: $("last_name").value.trim(),
            company_name: $("company_name").value.trim(),
            emails: readEmails(),
            phone_numbers: readPhones(),
            status: "final",
          };

          var result = await db.from("visiting_cards").insert(payload).select("id").single();
          $("saveBtn").disabled = false;

          if (result.error) {
            setStatus($("saveStatus"), "Save failed: " + result.error.message, "error");
            console.error(result.error);
            return;
          }

          setStatus($("saveStatus"), "Saved. ID: " + result.data.id, "ok");
        };

        addPhoneRow();
      }

      initDb();
      bindUi();
    })();
  </script>
</body>
</html>
