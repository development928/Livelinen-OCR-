<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Livelinen Card Scanner</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --text: #15202b;
      --hint: #667685;
      --card: #ffffff;
      --line: #d9e1e8;
      --accent: #0f6e56;
      --accent-text: #ffffff;
      --danger: #b42318;
      --ok: #067647;
      --radius: 14px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(circle at top left, #dff3ec 0%, transparent 40%),
        linear-gradient(180deg, #eef3f6 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .brand {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hint);
      margin: 0 0 8px;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; line-height: 1.2; }
    .sub { margin: 0 0 24px; color: var(--hint); line-height: 1.45; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 1rem; }
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .drop {
      display: block;
      border: 1.5px dashed #9db5c4;
      border-radius: 12px;
      padding: 20px 12px;
      text-align: center;
      background: #f8fbfd;
      cursor: pointer;
      min-height: 110px;
    }
    .drop strong { display: block; margin-bottom: 6px; color: var(--text); }
    .drop span { color: var(--hint); font-size: 0.85rem; }
    .preview {
      margin-top: 10px;
      width: 100%;
      max-height: 160px;
      object-fit: contain;
      border-radius: 10px;
      display: none;
      background: #fff;
      border: 1px solid var(--line);
    }
    label.field {
      display: block;
      margin: 12px 0 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--hint);
    }
    input[type="text"], input[type="tel"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 110, 86, 0.15);
    }
    textarea { min-height: 84px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .phone-block {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      background: #f8fbfd;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      font: inherit;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      background: #e8eef3;
      color: var(--text);
      flex: 1;
    }
    .btn-danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid #f3c0bb;
    }
    .status {
      min-height: 1.3em;
      margin-top: 10px;
      font-size: 0.92rem;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      background: #e8eef3;
      color: var(--text);
      font-weight: 600;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-text);
    }
    .hidden { display: none !important; }
    #jsOk {
      margin: 0 0 12px;
      font-size: 0.8rem;
      color: var(--hint);
    }
    .hint {
      margin: 0 0 12px;
      font-size: 0.85rem;
      color: var(--hint);
    }
    @media (max-width: 520px) {
      .row, .upload-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">Livelinen</p>
    <h1>Business Card Scanner</h1>
    <p class="sub">Upload front and back for OCR, or enter details manually.</p>
    <p id="jsOk">Loading controls…</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tabUpload" onclick="llShowUpload()">Upload &amp; OCR</button>
      <button type="button" class="tab" id="tabManual" onclick="llShowManual()">Manual entry</button>
    </div>

    <section class="panel" id="uploadPanel">
      <h2>1. Upload card images</h2>
      <p class="hint">Front is required. Back is optional but improves OCR.</p>
      <div class="upload-grid">
        <div>
          <label class="drop" for="fileFront">
            <strong>Front</strong>
            <span>Click to choose</span>
          </label>
          <input type="file" id="fileFront" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" />
          <img id="previewFront" class="preview" alt="Front preview" />
        </div>
        <div>
          <label class="drop" for="fileBack">
            <strong>Back</strong>
            <span>Optional</span>
          </label>
          <input type="file" id="fileBack" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" />
          <img id="previewBack" class="preview" alt="Back preview" />
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn-primary" id="ocrBtn" onclick="llRunOcr()" disabled>Run OCR</button>
      </div>
      <p class="status" id="ocrStatus" role="status"></p>
    </section>

    <section class="panel" id="formPanel">
      <h2 id="formTitle">2. Review / edit details</h2>
      <form id="cardForm" onsubmit="return llSaveCard(event)">
        <div class="row">
          <div>
            <label class="field" for="first_name">First name</label>
            <input type="text" id="first_name" name="first_name" autocomplete="given-name" />
          </div>
          <div>
            <label class="field" for="last_name">Last name</label>
            <input type="text" id="last_name" name="last_name" autocomplete="family-name" />
          </div>
        </div>

        <label class="field" for="company_name">Company</label>
        <input type="text" id="company_name" name="company_name" autocomplete="organization" />

        <label class="field" for="emails">Emails (one per line)</label>
        <textarea id="emails" placeholder="name@company.com"></textarea>

        <label class="field">Phone numbers</label>
        <div id="phones"></div>
        <div class="actions">
          <button type="button" class="btn-secondary" onclick="llAddPhone()">+ Add phone</button>
        </div>

        <button type="submit" class="btn-primary" id="saveBtn">Save card</button>
        <p class="status" id="saveStatus" role="status"></p>
      </form>
    </section>
  </div>

  <script>
    var llDb = null;
    var llFrontFile = null;
    var llBackFile = null;
    var LL_SUPABASE_URL = "https://xukgkqxkujygsupdjvvd.supabase.co";
    var LL_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1a2drcXhrdWp5Z3N1cGRqdnZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTYwNTAsImV4cCI6MjA5NjIzMjA1MH0.N5hqWj9EvdrfEpwu6gVNuBwglRKlp-Z_lzJzKvdHyY4";
    var LL_OCR_URL = "https://n8n.livelinen.org/webhook/c0ddefcc-4deb-49e6-a8c0-72c49da00a64";

    function llEl(id) { return document.getElementById(id); }

    function llSetStatus(id, message, type) {
      var node = llEl(id);
      if (!node) return;
      node.textContent = message || "";
      node.className = "status" + (type ? (" " + type) : "");
    }

    function llUpdateOcrButton() {
      llEl("ocrBtn").disabled = !llFrontFile;
    }

    function llShowUpload() {
      llEl("tabUpload").className = "tab active";
      llEl("tabManual").className = "tab";
      llEl("uploadPanel").className = "panel";
      llEl("formTitle").textContent = "2. Review / edit details";
      llSetStatus("saveStatus", "");
    }

    function llShowManual() {
      llEl("tabManual").className = "tab active";
      llEl("tabUpload").className = "tab";
      llEl("uploadPanel").className = "panel hidden";
      llEl("formTitle").textContent = "Enter details manually";
      llSetStatus("ocrStatus", "");
      llSetStatus("saveStatus", "Type the card details, then Save.");
      if (llEl("phones").children.length === 0) llAddPhone();
      try { llEl("first_name").focus(); } catch (e) {}
    }

    function llEscape(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function llAddPhone(phone) {
      phone = phone || { type: "mobile", number: "" };
      var wrap = document.createElement("div");
      wrap.className = "phone-block";
      wrap.innerHTML =
        '<label class="field">Type</label>' +
        '<input type="text" class="phone-type" value="' + llEscape(phone.type || "mobile") + '" />' +
        '<label class="field">Number</label>' +
        '<input type="tel" class="phone-number" value="' + llEscape(phone.number || "") + '" />' +
        '<div class="actions"><button type="button" class="btn-danger" onclick="this.parentNode.parentNode.remove(); if (!document.getElementById(\'phones\').children.length) llAddPhone();">Remove</button></div>';
      llEl("phones").appendChild(wrap);
    }

    function llFillForm(data) {
      data = data || {};
      llEl("first_name").value = data.first_name || "";
      llEl("last_name").value = data.last_name || "";
      llEl("company_name").value = data.company_name || "";
      llEl("emails").value = (data.emails && data.emails.join) ? data.emails.join("\n") : "";
      llEl("phones").innerHTML = "";
      var phones = data.phone_numbers || [];
      if (phones.length) {
        for (var i = 0; i < phones.length; i++) llAddPhone(phones[i]);
      } else {
        llAddPhone();
      }
    }

    function llReadEmails() {
      var raw = llEl("emails").value || "";
      var parts = raw.split(/\r?\n|,|;/);
      var out = [];
      for (var i = 0; i < parts.length; i++) {
        var v = parts[i].replace(/^\s+|\s+$/g, "");
        if (v) out.push(v);
      }
      return out;
    }

    function llReadPhones() {
      var blocks = llEl("phones").querySelectorAll(".phone-block");
      var out = [];
      for (var i = 0; i < blocks.length; i++) {
        var number = blocks[i].querySelector(".phone-number").value.replace(/^\s+|\s+$/g, "");
        if (!number) continue;
        out.push({
          type: blocks[i].querySelector(".phone-type").value.replace(/^\s+|\s+$/g, "") || "other",
          number: number
        });
      }
      return out;
    }

    function llFileToBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = String(reader.result || "");
          resolve(result.indexOf(",") >= 0 ? result.split(",")[1] : result);
        };
        reader.onerror = function () { reject(new Error("Could not read file")); };
        reader.readAsDataURL(file);
      });
    }

    function llBindFileInput(inputId, previewId, side) {
      llEl(inputId).onchange = function () {
        var file = llEl(inputId).files && llEl(inputId).files[0];
        if (!file) return;
        if (side === "front") llFrontFile = file;
        else llBackFile = file;
        llEl(previewId).src = URL.createObjectURL(file);
        llEl(previewId).style.display = "block";
        llUpdateOcrButton();
        if (llFrontFile && llBackFile) {
          llSetStatus("ocrStatus", "Front + back ready. Click Run OCR.");
        } else if (llFrontFile) {
          llSetStatus("ocrStatus", "Front ready. Add back (optional) or click Run OCR.");
        }
        llShowUpload();
      };
    }

    function llRunOcr() {
      if (!llFrontFile) {
        llSetStatus("ocrStatus", "Choose a front image first.", "error");
        return;
      }

      llEl("ocrBtn").disabled = true;
      llSetStatus("ocrStatus", llBackFile ? "Running OCR on front + back..." : "Running OCR on front...");

      var tasks = [llFileToBase64(llFrontFile)];
      if (llBackFile) tasks.push(llFileToBase64(llBackFile));

      Promise.all(tasks).then(function (parts) {
        var payload = {
          filenameFront: llFrontFile.name,
          mimeTypeFront: llFrontFile.type || "image/jpeg",
          imageBase64Front: parts[0],
          // keep old single-image keys for compatibility
          filename: llFrontFile.name,
          mimeType: llFrontFile.type || "image/jpeg",
          imageBase64: parts[0]
        };

        if (llBackFile) {
          payload.filenameBack = llBackFile.name;
          payload.mimeTypeBack = llBackFile.type || "image/jpeg";
          payload.imageBase64Back = parts[1];
          payload.hasBack = true;
        } else {
          payload.hasBack = false;
        }

        var xhr = new XMLHttpRequest();
        xhr.open("POST", LL_OCR_URL, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          llUpdateOcrButton();
          if (xhr.status < 200 || xhr.status >= 300) {
            llSetStatus("ocrStatus", "OCR failed (" + xhr.status + "). You can type manually.", "error");
            llShowManual();
            return;
          }
          try {
            var data = JSON.parse(xhr.responseText);
            llFillForm(data);
            llSetStatus("ocrStatus", "OCR done. Review the form below.", "ok");
          } catch (e) {
            llSetStatus("ocrStatus", "OCR returned invalid JSON. Type manually.", "error");
            llShowManual();
          }
        };
        xhr.onerror = function () {
          llUpdateOcrButton();
          llSetStatus("ocrStatus", "Network error calling OCR. Type manually.", "error");
          llShowManual();
        };
        xhr.send(JSON.stringify(payload));
      }).catch(function (err) {
        llUpdateOcrButton();
        llSetStatus("ocrStatus", err.message || "Could not read images", "error");
      });
    }

    function llSaveCard(event) {
      if (event && event.preventDefault) event.preventDefault();
      llSetStatus("saveStatus", "");
      llEl("saveBtn").disabled = true;

      if (!llDb) {
        llEl("saveBtn").disabled = false;
        llSetStatus("saveStatus", "Save unavailable (database not loaded). Refresh page.", "error");
        return false;
      }

      var payload = {
        first_name: llEl("first_name").value.replace(/^\s+|\s+$/g, ""),
        last_name: llEl("last_name").value.replace(/^\s+|\s+$/g, ""),
        company_name: llEl("company_name").value.replace(/^\s+|\s+$/g, ""),
        emails: llReadEmails(),
        phone_numbers: llReadPhones(),
        status: "final"
      };

      llDb.from("visiting_cards").insert(payload).select("id").single().then(function (result) {
        llEl("saveBtn").disabled = false;
        if (result.error) {
          llSetStatus("saveStatus", "Save failed: " + result.error.message, "error");
          return;
        }
        llSetStatus("saveStatus", "Saved. ID: " + result.data.id, "ok");
      }).catch(function (err) {
        llEl("saveBtn").disabled = false;
        llSetStatus("saveStatus", "Save failed: " + (err.message || "unknown"), "error");
      });

      return false;
    }

    llAddPhone();
    llEl("jsOk").textContent = "Controls ready.";
    llEl("jsOk").style.color = "#067647";
    llBindFileInput("fileFront", "previewFront", "front");
    llBindFileInput("fileBack", "previewBack", "back");

    (function loadSupabase() {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = function () {
        try {
          if (window.supabase && window.supabase.createClient) {
            llDb = window.supabase.createClient(LL_SUPABASE_URL, LL_SUPABASE_ANON_KEY);
          }
        } catch (e) {
          console.error(e);
        }
      };
      s.onerror = function () {
        llSetStatus("saveStatus", "Database library failed to load. Manual typing still works; refresh to retry save.", "error");
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
